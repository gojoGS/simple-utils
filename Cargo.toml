[package]
name = "shutils"
version = "0.1.0"
edition = "2024"
description = "Simple shell utilities"
license = "MIT"
repository = ""
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
